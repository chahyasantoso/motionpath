name: CI

on:
  push:
    branches: [v4, v4.1, v4.2, "v4.2-**", main]
  pull_request:
    branches: [v4, v4.1, v4.2, main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: validation (node 24)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Check published declarations
        run: npm run typecheck
      - name: Build application
        run: npm run build
      - name: Check package contents
        run: npm run pack:check
