name: Format fix

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch or ref to format
        required: true
        default: master
        type: string

permissions:
  contents: write

jobs:
  format-fix:
    name: apply Prettier formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm exec --yes --package=prettier@3.6.2 -- prettier . --write
      - name: Commit formatting changes
        run: |
          if git diff --quiet; then
            echo "Formatting is already clean."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply Prettier formatting"
          git push origin HEAD:${{ inputs.ref }}
